<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Pribadi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0d12;
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 700px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #11141b;
    }

    header {
      padding: 16px;
      background: #171b24;
      border-bottom: 1px solid #292e39;
    }

    header h2 {
      margin: 0;
      font-size: 18px;
    }

    header p {
      margin: 4px 0 0;
      color: #8f98a8;
      font-size: 13px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
    }

    .message {
      max-width: 82%;
      padding: 11px 14px;
      margin-bottom: 12px;
      border-radius: 15px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      margin-left: auto;
      background: #315efb;
      border-bottom-right-radius: 4px;
    }

    .ai {
      margin-right: auto;
      background: #202530;
      border-bottom-left-radius: 4px;
    }

    .typing {
      opacity: 0.6;
      font-style: italic;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #171b24;
      border-top: 1px solid #292e39;
    }

    textarea {
      flex: 1;
      resize: none;
      height: 48px;
      border: none;
      outline: none;
      border-radius: 13px;
      padding: 14px;
      background: #242934;
      color: white;
      font-size: 15px;
    }

    button {
      width: 52px;
      border: none;
      border-radius: 13px;
      background: #315efb;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <h2>AI Pribadi</h2>
      <p>private chat</p>
    </header>

    <main id="chat"></main>

    <div class="input-area">
      <textarea
        id="input"
        placeholder="Ketik pesan..."
        rows="1"
      ></textarea>

      <button id="send">➤</button>
    </div>

  </div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");

let messages = JSON.parse(
  localStorage.getItem("ai_chat") || "[]"
);

function addMessage(role, text, save = true) {
  const div = document.createElement("div");

  div.className = "message " + role;
  div.textContent = text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  if (save) {
    messages.push({
      role: role === "user" ? "user" : "assistant",
      content: text
    });

    localStorage.setItem(
      "ai_chat",
      JSON.stringify(messages)
    );
  }
}

function loadChat() {
  if (messages.length === 0) {
    addMessage(
      "ai",
      "yo 👋 gue AI pribadi lu. mau ngobrol apa?"
    );
    return;
  }

  messages.forEach(msg => {
    addMessage(
      msg.role === "user" ? "user" : "ai",
      msg.content,
      false
    );
  });
}

async function sendMessage() {
  const text = input.value.trim();

  if (!text) return;

  input.value = "";
  send.disabled = true;

  addMessage("user", text);

  const typing = document.createElement("div");
  typing.className = "message ai typing";
  typing.textContent = "lagi mikir...";
  chat.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;

  try {
    const response = await fetch("/.netlify/functions/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: messages
      })
    });

    const data = await response.json();

    typing.remove();

    if (!response.ok) {
      throw new Error(data.error || "Terjadi error");
    }

    addMessage("ai", data.reply);

  } catch (error) {
    typing.remove();

    addMessage(
      "ai",
      "error: " + error.message
    );
  }

  send.disabled = false;
  input.focus();
}

send.addEventListener("click", sendMessage);

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

loadChat();
</script>

</body>
</html>
